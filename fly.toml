# fly.toml app configuration file generated for cashflow-game-server on 2026-06-06T23:30:14+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cashflow-game-server'
primary_region = 'fra'

[build]
  dockerfile = 'apps/server/Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  WS_PATH = '/ws'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
